[project]
name = "tola-bot-tg-api"
version = "0.1.0"
description = "Queued large-file delivery for TolaAI through the official local Telegram Bot API server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TolaAI" }]
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.0",
    "redis>=6.4.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.31.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC240"]
